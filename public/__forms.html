<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Admiral Energy Form Definitions</title></head>
  <body>
    <!-- Static declarations allow Netlify Forms to discover the client-rendered forms. -->
    <form name="resilience-list" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
      <input name="source" />
    </form>
    <form name="home-backup-assessment" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="zip" />
      <input name="homeowner" />
      <input name="priority" />
      <textarea name="message"></textarea>
    </form>
    <form name="bulk-order-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="quantity" />
      <input name="timeline" />
      <textarea name="notes"></textarea>
    </form>
    <form name="sidekick-interest" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="session-id" />
      <input name="reason" />
    </form>
  </body>
</html>
